name: Ecosystem checks

# Shared by every plugin in the suite. A plugin calls it from its own
# workflow:
#
#   jobs:
#     ecosystem:
#       uses: MattFalahe/manager-core/.github/workflows/ecosystem.yml@dev
#
# ci/ecosystem/README.md describes each check and the plugin's manifest.

on:
  workflow_call:
    inputs:
      kit-ref:
        description: Manager Core ref to take the check kit from
        type: string
        default: dev
      plugin-repository:
        description: Repository to check, when it is not the caller's
        type: string
        default: ''
      plugin-ref:
        description: Ref to check, when it is not the pushed commit
        type: string
        default: ''
      work-branch:
        description: The plugin's work branch, for a plugin plugins.json does not list
        type: string
        default: ''

permissions:
  contents: read

env:
  PLUGIN_REPOSITORY: ${{ inputs.plugin-repository || github.repository }}
  PLUGIN_REF: ${{ inputs.plugin-ref || github.sha }}
  # The commit the push started from, so migration rules know what is new.
  SINCE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
  SEAT_EXTENSIONS: bcmath, ctype, curl, dom, fileinfo, gd, gmp, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, tokenizer, xml, zip
  # SeAT 5 is pinned to Laravel 10, which has published advisories, and
  # Composer 2.9+ refuses those by default. The test install has to get the
  # same packages a real SeAT runs. The second name is the older spelling.
  COMPOSER_NO_BLOCKING: '1'
  COMPOSER_NO_SECURITY_BLOCKING: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.branch.outputs.run }}
      # A valid list even when nothing runs, so the install matrix still parses.
      mc-variants: ${{ steps.plan.outputs.mc-variants || '["absent"]' }}
      package: ${{ steps.plan.outputs.package }}
      relation: ${{ steps.plan.outputs.relation }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: MattFalahe/manager-core
          ref: ${{ inputs.kit-ref }}
          path: kit
          sparse-checkout: ci
      # Only the release on the default branch and the plugin's work branch
      # are checked, never a branch the work has moved on from. The work
      # branch comes from plugins.json, so moving to a new one is one line
      # there, or from the work-branch input for a plugin it does not list.
      - id: branch
        env:
          ASKED_REF: ${{ inputs.plugin-ref }}
          WORK_BRANCH: ${{ inputs.work-branch }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$ASKED_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$PUSHED"
          [ "$EVENT" = pull_request ] && branch="$PR_BASE"
          active=$(jq -r --arg repo "${PLUGIN_REPOSITORY,,}" '.[] | select((.repository | ascii_downcase) == $repo) | .branch' kit/ci/ecosystem/plugins.json)
          source="from Manager Core's ci/ecosystem/plugins.json"
          if [ -z "$active" ]; then
            active="$WORK_BRANCH"
            source="from work-branch in this repository's .github/workflows/ecosystem.yml"
          fi
          if [ -z "$active" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No work branch named::Neither plugins.json nor work-branch names this plugin's work branch, so every branch is checked."
          elif [ "$branch" = "$DEFAULT_BRANCH" ] || [ "$branch" = "$active" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ecosystem checks skipped::$branch is neither $DEFAULT_BRANCH nor the work branch $active ($source)."
          fi
      - if: steps.branch.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PLUGIN_REPOSITORY }}
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
          fetch-depth: 0
      - if: steps.branch.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - id: plan
        if: steps.branch.outputs.run == 'true'
        run: php kit/ci/ecosystem/check.php plan plugin | tee -a "$GITHUB_OUTPUT"

  static:
    name: Source
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PLUGIN_REPOSITORY }}
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: MattFalahe/manager-core
          ref: ${{ inputs.kit-ref }}
          path: kit
          sparse-checkout: ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Manifest, Blade, migrations, comments, em-dashes, CDN, modals
        run: php kit/ci/ecosystem/check.php static plugin --since="$SINCE"

  classes:
    name: Classes on PHP ${{ matrix.php }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PLUGIN_REPOSITORY }}
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
      - uses: actions/checkout@v5
        with:
          repository: MattFalahe/manager-core
          ref: ${{ inputs.kit-ref }}
          path: kit
          sparse-checkout: ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: ${{ env.SEAT_EXTENSIONS }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ github.run_id }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - name: Every PHP file parses
        run: find plugin -name '*.php' -not -name '*.blade.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: SeAT and its packages
        run: |
          composer create-project eveseat/seat:^5.0 seat --no-interaction --no-progress --no-scripts --no-dev --prefer-dist
          cd seat
          composer config repositories.plugin "{\"type\": \"path\", \"url\": \"../plugin\", \"options\": {\"symlink\": true, \"versions\": {\"${{ needs.plan.outputs.package }}\": \"dev-ci\"}}}"
          composer require "${{ needs.plan.outputs.package }}:dev-ci" --no-update --no-interaction
          if [ "${{ needs.plan.outputs.relation }}" != "self" ]; then
            # Every class loads beside Manager Core; its absence is the install job's to test.
            composer require mattfalahe/manager-core:dev-dev --no-update --no-interaction
          fi
          composer update --no-scripts --no-dev --no-interaction --no-progress
      - name: Every class and migration loads
        run: php kit/ci/ecosystem/check.php classes plugin --autoload=seat/vendor/autoload.php

  install:
    name: SeAT install, Manager Core ${{ matrix.mc }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.plan.outputs.mc-variants) }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: seat
          MARIADB_USER: seat
          MARIADB_PASSWORD: seat
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PLUGIN_REPOSITORY }}
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: MattFalahe/manager-core
          ref: ${{ inputs.kit-ref }}
          path: kit
          sparse-checkout: ci
      # The PHP the SeAT Docker image runs.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: ${{ env.SEAT_EXTENSIONS }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php8.4-${{ github.run_id }}
          restore-keys: composer-${{ runner.os }}-php8.4-
      - name: SeAT
        run: |
          composer create-project eveseat/seat:^5.0 seat --no-interaction --no-progress --no-scripts --no-dev --prefer-dist
          cd seat
          cp .env.example .env
          sed -i -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' -e 's/^DB_DATABASE=.*/DB_DATABASE=seat/' \
                 -e 's/^DB_USERNAME=.*/DB_USERNAME=seat/' -e 's/^DB_PASSWORD=.*/DB_PASSWORD=seat/' \
                 -e 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' -e 's/^APP_ENV=.*/APP_ENV=production/' .env
          php artisan key:generate --force
      # As the Docker entrypoint does: require, then update only what changed.
      - name: The plugin, and Manager Core ${{ matrix.mc }}
        working-directory: seat
        run: |
          composer config repositories.plugin "{\"type\": \"path\", \"url\": \"../plugin\", \"options\": {\"symlink\": true, \"versions\": {\"${{ needs.plan.outputs.package }}\": \"dev-ci\"}}}"
          packages="${{ needs.plan.outputs.package }}:dev-ci"
          case "${{ matrix.mc }}" in
            absent|self) ;;
            dev) packages="$packages mattfalahe/manager-core:dev-dev" ;;
            *) packages="$packages mattfalahe/manager-core:${{ matrix.mc }}" ;;
          esac
          names=""
          for p in $packages; do names="$names ${p%%:*}"; done
          composer require $packages --no-install --no-interaction
          composer update $names --no-scripts --no-dev --no-interaction --no-progress
          composer dump-autoload
          composer show mattfalahe/* || true
      - name: Publish, cache config and routes
        working-directory: seat
        run: |
          php artisan vendor:publish --force --all > /dev/null
          php artisan config:cache
          php artisan route:cache
      - name: Migrate on MariaDB 10.11
        working-directory: seat
        run: php artisan migrate --force
      - name: Seed, as every boot does
        working-directory: seat
        run: php artisan db:seed --class='Seat\Services\Database\Seeders\PluginDatabaseSeeder' --force
      - name: Commands and schedule load
        working-directory: seat
        run: |
          php artisan list > /dev/null
          php artisan schedule:list
      - name: Manager Core contract, routes, assets, schedule
        working-directory: seat
        run: php ../kit/ci/ecosystem/check.php runtime ../plugin --seat=. --mc="${{ matrix.mc }}"
      - name: New migrations run twice, seeders run twice
        working-directory: seat
        run: php ../kit/ci/ecosystem/check.php rerun ../plugin --seat=. --since="$SINCE"

  cross:
    name: Links to other plugins
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PLUGIN_REPOSITORY }}
          ref: ${{ env.PLUGIN_REF }}
          path: plugin
      - uses: actions/checkout@v5
        with:
          repository: MattFalahe/manager-core
          ref: ${{ inputs.kit-ref }}
          path: kit
          sparse-checkout: ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Subscriptions, capability calls and routes against the other manifests
        run: php kit/ci/ecosystem/check.php cross plugin
